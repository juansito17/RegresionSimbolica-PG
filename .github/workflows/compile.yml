name: Compile and Test

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  build-cpp:
    name: Build C++ Motor (CUDA/GPU Enabled)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (OpenMP)
      run: |
        sudo apt-get update
        sudo apt-get install -y libomp-dev

    - name: Install CUDA Toolkit
      uses: jimver/cuda-toolkit@v0.2.16
      id: cuda-toolkit
      with:
        cuda: '12.4.0'

    - name: Configure CMake (with CUDA detection)
      run: |
        cd legacy/cpp_engine
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build SymbolicRegressionGP & TestOperators
      run: |
        cd legacy/cpp_engine
        cmake --build build --config Release

    - name: Run C++ Operators Tests (CPU Fallback)
      run: |
        cd legacy/cpp_engine
        ./build/TestOperators

  build-python:
    name: Build & Test Python (CUDA/GPU Enabled)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install CUDA Toolkit
      uses: jimver/cuda-toolkit@v0.2.16
      id: cuda-toolkit
      with:
        cuda: '12.4.0'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ninja
        # Install PyTorch specifically compiled for CUDA 12.4
        pip install torch --index-url https://download.pytorch.org/whl/cu124
        pip install -e ".[benchmark]"

    - name: Compile Python CUDA Extension
      env:
        TORCH_CUDA_ARCH_LIST: "8.6"
      run: |
        export CUDA_HOME=$CUDA_PATH
        echo "Compiling with CUDA_HOME=$CUDA_HOME"
        cd src/warpsymbolic/gpu/cuda
        python setup.py build_ext --build-temp ../../../../.local/build/cuda/temp --build-lib ../../../../.local/build/python

    - name: Run Python CUDA Extension Smoke Test
      run: |
        python -c "from warpsymbolic.gpu.cuda_loader import load_rpn_cuda_native; import torch; load_rpn_cuda_native(); print('CUDA extension loaded; device=', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'compile-only runner')"
