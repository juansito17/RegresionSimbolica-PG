[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-symbolic"
version = "1.0.0"
description = "GPU-first evolutionary symbolic regression with a scikit-learn compatible API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.20",
    "pandas>=1.5",
    "scipy>=1.8",
    "scikit-learn>=1.2",
    "sympy>=1.9",
    "torch>=2.0",
]

[project.optional-dependencies]
benchmark = [
    "pyarrow>=12",
    "requests>=2.28",
]
dev = [
    "pytest>=8",
]

[project.scripts]
warp-symbolic = "warpsymbolic.cli.run_gpu_console:main"
warp-symbolic-srbench = "warpsymbolic.cli.benchmark_srbench:main"
alphasymbolic-srbench = "AlphaSymbolic.scripts.benchmark_srbench:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["warpsymbolic*", "AlphaSymbolic*"]

[tool.setuptools.package-data]
"warpsymbolic.cli" = [
    "srbench_2025_manifest.json",
]
"warpsymbolic.gpu" = [
    "cuda/*.cpp",
    "cuda/*.cu",
    "cuda/setup.py",
]
